<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="이미지를 자유롭게 배치하고 PNG와 편집 파일로 저장하는 사분면 편집기"
    />
    <title>사분면 스튜디오</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="editor-panel is-open" id="editorPanel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">QUADRANT STUDIO</p>
            <h1>사분면 편집기</h1>
          </div>
          <button
            class="panel-toggle"
            id="panelToggle"
            type="button"
            aria-expanded="true"
          >
            접기
          </button>
        </div>

        <div class="panel-content">
          <section class="control-section">
            <div class="section-title"><span>01</span><h2>문구 편집</h2></div>
            <label>
              상단 제목
              <input id="titleInput" maxlength="42" value="제목" />
            </label>
            <div class="axis-inputs">
              <label>위<input id="topInput" maxlength="42" value="사분면 내용 1" /></label>
              <label>오른쪽<input id="rightInput" maxlength="42" value="사분면 내용 2" /></label>
              <label>아래<input id="bottomInput" maxlength="42" value="사분면 내용 3" /></label>
              <label>왼쪽<input id="leftInput" maxlength="42" value="사분면 내용 4" /></label>
            </div>
          </section>

          <section class="control-section">
            <div class="section-title"><span>02</span><h2>이미지</h2></div>
            <button class="upload-button" id="uploadButton" type="button">
              <span>＋</span> 이미지 여러 장 추가
            </button>
            <input
              class="visually-hidden"
              id="imageInput"
              type="file"
              accept="image/jpeg,image/png,image/webp"
              multiple
            />
            <p class="hint">JPG, PNG, WebP · 파일당 최대 20MB</p>
            <div class="layer-actions">
              <button id="frontButton" type="button" disabled>맨 앞으로</button>
              <button id="backButton" type="button" disabled>맨 뒤로</button>
              <button class="danger" id="deleteButton" type="button" disabled>삭제</button>
            </div>
          </section>

          <section class="control-section">
            <div class="section-title"><span>03</span><h2>저장 및 내보내기</h2></div>
            <div class="export-grid">
              <button class="primary-button" id="pngButton" type="button">PNG 내려받기</button>
              <button id="saveButton" type="button">편집 파일 저장</button>
              <button id="loadButton" type="button">편집 파일 불러오기</button>
            </div>
            <input
              class="visually-hidden"
              id="projectInput"
              type="file"
              accept=".json,application/json"
            />
          </section>
        </div>
        <p class="status-message" id="status" role="status">
          이미지를 추가해 나만의 사분면을 만들어보세요.
        </p>
      </aside>

      <section class="workspace" aria-label="사분면 작업 공간">
        <header class="workspace-header">
          <div><p class="eyebrow">LIVE CANVAS</p><h2>배치 미리보기</h2></div>
          <div class="workspace-meta"><span id="imageCount">0개 이미지</span><span>1:1</span></div>
        </header>

        <div class="board-frame">
          <div class="quadrant-board" id="board">
            <div class="board-title" id="boardTitle">제목</div>
            <div class="plot-grid" aria-hidden="true"></div>
            <div class="axis axis-horizontal" aria-hidden="true"></div>
            <div class="axis axis-vertical" aria-hidden="true"></div>
            <div class="axis-label label-top" id="labelTop">사분면 내용 1</div>
            <div class="axis-label label-right" id="labelRight">사분면 내용 2</div>
            <div class="axis-label label-bottom" id="labelBottom">사분면 내용 3</div>
            <div class="axis-label label-left" id="labelLeft">사분면 내용 4</div>
            <div class="drop-overlay" id="dropOverlay" hidden>여기에 이미지를 놓으세요</div>
          </div>
        </div>
        <p class="canvas-tip">
          이미지를 눌러 이동하고, 오른쪽 아래 핸들로 크기를 조절하세요.
        </p>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
